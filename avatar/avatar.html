<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Eduardo el Calvo - Avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%;
               font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif; }
  body.fondo-verde { background: #00ff00; }
  body.fondo-vista { background: repeating-conic-gradient(#d9d9d9 0% 25%, #f2f2f2 0% 50%) 50% / 32px 32px; }
  /* Arriba: espacio para la burbuja (30%). Abajo: Eduardo (70%). Sin burbuja: Eduardo ocupa todo. */
  #escena { position: absolute; inset: 0; display: grid; grid-template-rows: 26% 74%; justify-items: center; }
  #escena.sin-burbuja { grid-template-rows: 0 100%; }
  #zona-burbuja { width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 0; overflow: visible; }
  #avatar { width: 100%; height: 100%; display: block; overflow: visible; min-height: 0; }

  /* ---------- Burbuja de diálogo ---------- */
  #burbuja { position: relative; max-width: min(92vw, 560px); margin: 0 12px 20px; padding: 10px 16px;
             background: #fff; color: #222; border: 4px solid #2b2b2b; border-radius: 22px;
             font-size: clamp(12px, min(4.2vw, 3.6vh), 26px); font-weight: 700; line-height: 1.25; text-align: center;
             box-shadow: 0 6px 0 rgba(0,0,0,.18); opacity: 0; transform: translateY(10px) scale(.96);
             transition: opacity .25s ease, transform .25s ease; }
  #burbuja::after { content: ""; position: absolute; left: 50%; bottom: -22px; margin-left: -14px;
                    border: 14px solid transparent; border-top: 18px solid #2b2b2b; }
  #burbuja.largo { font-size: clamp(11px, min(3.4vw, 2.9vh), 21px); }
  #burbuja.muy-largo { font-size: clamp(10px, min(2.9vw, 2.4vh), 18px); }
  #burbuja.visible { opacity: 1; transform: translateY(0) scale(1); }
  #burbuja .nombre { color: #e2572b; }

  /* ---------- Movimiento general ---------- */
  #cuerpo { transform-origin: 200px 560px; animation: respirar 3.2s ease-in-out infinite; }
  @keyframes respirar { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  #cabeza { transform-origin: 200px 270px; transition: transform .15s ease; }
  .hablando #cabeza { animation: asentir .9s ease-in-out infinite; }
  @keyframes asentir { 0%,100% { transform: rotate(0deg) } 30% { transform: rotate(-2deg) } 70% { transform: rotate(2deg) } }

  /* ---------- Parpadeo ---------- */
  .parpado { transform: translateY(-17px); transition: transform .07s ease-in; }
  .parpadeo .parpado { transform: translateY(12px); }
  .ojo-feliz { opacity: 0; }

  /* ---------- Brillo de la calva ---------- */
  #reflejo { animation: reflejo-suave 3.5s ease-in-out infinite; }
  @keyframes reflejo-suave { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
  #barrido { animation: barrer 5s ease-in-out infinite; }
  @keyframes barrer { 0%, 62% { transform: translateX(-200px) } 82%, 100% { transform: translateX(200px) } }
  .hablando #barrido { animation-duration: 3.2s; }
  #destello-chico { transform-box: fill-box; transform-origin: center; animation: titilar 5s ease-in-out infinite; }
  @keyframes titilar { 0%, 70%, 100% { transform: scale(0) rotate(0deg); opacity: 0 }
                       78% { transform: scale(1) rotate(45deg); opacity: 1 } 88% { transform: scale(0) rotate(90deg); opacity: 0 } }
  .chispa { opacity: 0; transform-box: fill-box; transform-origin: center; }
  #rayos { opacity: 0; transform-origin: 200px 140px; }

  /* ---------- Risa: ojos felices, rebote y ráfaga de brillo ---------- */
  .riendo .ojo-abierto { opacity: 0; }
  .riendo .ojo-feliz { opacity: 1; }
  .riendo #cabeza { animation: rebote-risa .32s ease-in-out infinite; }
  @keyframes rebote-risa { 0%,100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-9px) rotate(-3deg) }
                           75% { transform: translateY(-4px) rotate(3deg) } }
  .riendo #reflejo { animation: flash 0.32s ease-in-out infinite; }
  @keyframes flash { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  .riendo #brillo-calva { animation: brillo-fuerte .5s ease-in-out infinite; }
  @keyframes brillo-fuerte { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  .riendo #rayos { animation: rayos .45s ease-in-out infinite; }
  @keyframes rayos { 0%,100% { opacity: .7; transform: scale(.94) } 50% { opacity: 1; transform: scale(1.12) } }
  .riendo .chispa { animation: chispa 0.9s ease-out infinite both; }
  #chispas g:nth-child(2) .chispa { animation-delay: .15s } #chispas g:nth-child(3) .chispa { animation-delay: .3s }
  #chispas g:nth-child(4) .chispa { animation-delay: .45s } #chispas g:nth-child(5) .chispa { animation-delay: .6s }
  #chispas g:nth-child(6) .chispa { animation-delay: .75s }
  @keyframes chispa { 0%,100% { opacity: .7; transform: scale(.75) rotate(0deg) } 45% { opacity: 1; transform: scale(1.45) rotate(45deg) } }
  .riendo #mejillas { opacity: 1; } #mejillas { opacity: .8; transition: opacity .2s; }
  .riendo #mejillas ellipse { transform-box: fill-box; transform-origin: center; transform: translateY(-3px) scale(1.15); }
  #boca-risa { transform-box: fill-box; transform-origin: 50% 0%; }
  .riendo #flash-calva { animation: flash-grande .45s ease-in-out infinite; }
  @keyframes flash-grande { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

  #mano-risa { opacity: 0; transform: translateY(150px); transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  .riendo #mano-risa { opacity: 1; transform: translateY(0); }
  .riendo #mano-risa g { animation: pulgar .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes pulgar { 0%,100% { transform: translate(300px,430px) rotate(0deg) } 50% { transform: translate(300px,424px) rotate(-6deg) } }
  .riendo #torso { animation: sacudir .32s ease-in-out infinite; }
  @keyframes sacudir { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  #aviso { position: fixed; left: 8px; bottom: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
           background: rgba(0,0,0,.72); color: #fff; font-size: 13px; display: none; }

  body.fondo-magenta { background: #ff00ff; }

  /* ================= DISFRACES (se ponen con !Edu disfraz) ================= */
  .disfraz { display: none; }
  .disfraz-fiesta #d-fiesta, .disfraz-sombrero #d-sombrero, .disfraz-lentes #d-lentes, .disfraz-corona #d-corona,
  .disfraz-peluca #d-peluca, .disfraz-bigote #d-bigote, .disfraz-gorra #d-gorra, .disfraz-santa #d-santa {
    display: inline; animation: poner-disfraz .55s cubic-bezier(.3,1.5,.5,1) both; }
  .disfraz > g { transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes poner-disfraz { 0% { transform: translateY(-70px) scale(.7); opacity: 0 } 60% { opacity: 1 }
                             100% { transform: translateY(0) scale(1); opacity: 1 } }
  #d-fiesta .pompon, #d-santa .pompon { transform-box: fill-box; transform-origin: center; animation: pompon 1.6s ease-in-out infinite; }
  @keyframes pompon { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
  #d-lentes .reflejo-lente { animation: reflejo-lente 3.5s ease-in-out infinite; }
  @keyframes reflejo-lente { 0%, 60% { transform: translateX(-26px); opacity: 0 } 70% { opacity: .9 } 85%, 100% { transform: translateX(26px); opacity: 0 } }
  #d-corona .joya { animation: reflejo-suave 1.4s ease-in-out infinite; }

  /* ================= GESTOS (!Edu baila, !Edu saluda... o la IA con [gesto:x]) ================= */
  .extra-gesto { opacity: 0; transition: opacity .2s; pointer-events: none; }
  #cejas { transition: transform .2s ease, opacity .15s; }
  .ojo-abierto { transform-box: fill-box; transform-origin: center; transition: transform .18s ease, opacity .1s; }
  /* Enojo fingido */
  .gesto-enojo #cejas, .gesto-triste #cejas { opacity: 0; }
  .gesto-enojo #cejas-enojo, .gesto-enojo #rubor-enojo, .gesto-enojo #vapor { opacity: 1; }
  .gesto-enojo #rubor-enojo { animation: latir .7s ease-in-out infinite; }
  @keyframes latir { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
  .gesto-enojo #vapor circle { transform-box: fill-box; transform-origin: center; animation: vapor 1.1s ease-out infinite; }
  #vapor circle:nth-child(2n) { animation-delay: .35s !important } #vapor circle:nth-child(3n) { animation-delay: .7s !important }
  @keyframes vapor { 0% { transform: translateY(0) scale(.4); opacity: .9 } 100% { transform: translateY(-38px) scale(1.5); opacity: 0 } }
  .gesto-enojo:not(.riendo) #cabeza { animation: temblor .14s linear infinite; }
  @keyframes temblor { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-2.5px) } 75% { transform: translateX(2.5px) } }
  .gesto-enojo:not(.hablando):not(.riendo) #sonrisa, .gesto-triste:not(.hablando):not(.riendo) #sonrisa,
  .gesto-sorpresa:not(.hablando):not(.riendo) #sonrisa { opacity: 0 !important; }
  .gesto-enojo:not(.hablando):not(.riendo) #boca-triste, .gesto-triste:not(.hablando):not(.riendo) #boca-triste { opacity: 1; }
  /* Sorpresa */
  .gesto-sorpresa .ojo-abierto { transform: scale(1.2); }
  .gesto-sorpresa #cejas { transform: translateY(-10px); }
  .gesto-sorpresa:not(.hablando):not(.riendo) #boca-o { opacity: 1; }
  .gesto-sorpresa #exclamacion { opacity: 1; }
  .gesto-sorpresa #exclamacion g { transform-box: fill-box; transform-origin: 50% 100%; animation: brincar .5s cubic-bezier(.3,1.6,.5,1) both; }
  .gesto-sorpresa:not(.riendo) #cabeza { animation: susto .45s ease-out both; }
  @keyframes susto { 0% { transform: translateY(0) } 35% { transform: translateY(-14px) rotate(-2deg) } 100% { transform: translateY(-4px) } }
  @keyframes brincar { 0% { transform: scale(0) } 100% { transform: scale(1) } }
  /* Guiño */
  .gesto-guino:not(.riendo) #ojo-der { opacity: 0; }
  .gesto-guino:not(.riendo) #guino-der { opacity: 1; }
  .gesto-guino #guino-der use { transform-box: fill-box; transform-origin: center; animation: titilar-guino .9s ease-in-out infinite; }
  @keyframes titilar-guino { 0%,100% { transform: scale(.5) rotate(0deg) } 50% { transform: scale(1.1) rotate(45deg) } }
  .gesto-guino:not(.riendo):not(.hablando) #cabeza { transform: rotate(-5deg); }
  /* Baile */
  .gesto-baile #cuerpo { animation: bailar .6s ease-in-out infinite; }
  @keyframes bailar { 0%,100% { transform: translateX(-12px) rotate(-3deg) } 25% { transform: translateX(0) translateY(-10px) rotate(0) }
                      50% { transform: translateX(12px) rotate(3deg) } 75% { transform: translateX(0) translateY(-10px) rotate(0) } }
  .gesto-baile:not(.riendo) #cabeza { animation: cabecear .6s ease-in-out infinite; }
  @keyframes cabecear { 0%,100% { transform: rotate(5deg) } 50% { transform: rotate(-5deg) } }
  .gesto-baile #notas { opacity: 1; }
  .gesto-baile #notas g { transform-box: fill-box; transform-origin: center; animation: nota 1.8s ease-out infinite; }
  #notas g:nth-child(2) { animation-delay: .6s !important } #notas g:nth-child(3) { animation-delay: 1.2s !important }
  @keyframes nota { 0% { transform: translateY(20px) rotate(-15deg); opacity: 0 } 20% { opacity: 1 }
                    100% { transform: translateY(-70px) rotate(15deg); opacity: 0 } }
  /* Saludo con la mano */
  #mano-saludo { transform: translateY(170px); transition: transform .35s cubic-bezier(.3,1.5,.5,1), opacity .2s; }
  .gesto-saludo #mano-saludo { opacity: 1; transform: translateY(0); }
  .gesto-saludo #mano-saludo > g { transform-origin: 84px 445px; animation: saludar .42s ease-in-out infinite alternate; }
  @keyframes saludar { from { transform: rotate(-16deg) } to { transform: rotate(12deg) } }
  /* Triste dramático */
  .gesto-triste #cejas-triste, .gesto-triste #lagrimas { opacity: 1; }
  .gesto-triste #lagrimas path { transform-box: fill-box; animation: lagrima 1.1s ease-in infinite; }
  #lagrimas path:nth-child(2) { animation-delay: .45s !important }
  @keyframes lagrima { 0% { transform: translateY(0) scale(.6); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(70px) scale(1); opacity: 0 } }
  .gesto-triste:not(.riendo) #cabeza { animation: sollozo 1.2s ease-in-out infinite; }
  @keyframes sollozo { 0%,100% { transform: translateY(4px) rotate(2deg) } 50% { transform: translateY(8px) rotate(-1deg) } }

  /* ================= RULETA (!Edu ruleta) ================= */
  #ruleta { position: absolute; left: 50%; top: 2%; width: min(80vw, 50vh); transform: translateX(-50%) scale(.6);
            display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; z-index: 5;
            transition: opacity .3s ease, transform .5s cubic-bezier(.3,1.4,.5,1), top .6s ease, left .6s ease, width .6s ease; }
  #ruleta.visible { opacity: 1; transform: translateX(-50%) scale(1); }
  #ruleta.mini { top: 57%; left: 19%; width: min(34vw, 23vh); }
  .sin-entrada .disfraz { animation: none !important; }
  #ruleta-titulo { font-weight: 900; font-size: clamp(14px, min(5.2vw, 3.6vh), 30px); color: #ffd23f; letter-spacing: .5px;
                   -webkit-text-stroke: 1.5px #3a1d00; text-shadow: 0 3px 0 #3a1d00; margin-bottom: 4px; white-space: nowrap; }
  #ruleta.mini #ruleta-titulo, #ruleta.mini #ruleta-nombre { display: none; }
  #ruleta-nombre { background: #fff; border: 4px solid #2b2b2b; border-radius: 14px; padding: 4px 14px; margin-bottom: 8px;
                   font-weight: 900; font-size: clamp(13px, min(4.6vw, 3.2vh), 26px); color: #e2572b; min-width: 50%;
                   text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #ruleta-caja { position: relative; width: 100%; aspect-ratio: 1; filter: drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
  #ruleta-svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #ruleta-rueda { transform-box: fill-box; transform-origin: 50% 50%; }
  .sin-transicion #ruleta, .sin-transicion #ruleta-resultado { transition: none !important; }
  #ruleta-rueda.girando { transition: transform 4.6s cubic-bezier(.12,.62,.1,1); }
  #ruleta-rueda text { font-weight: 900; font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif; fill: #fff;
                       paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 2.2px; }
  #ruleta-resultado { margin-top: 8px; background: #ffd23f; border: 4px solid #3a1d00; border-radius: 16px; padding: 4px 14px;
                      font-weight: 900; font-size: clamp(13px, min(4.8vw, 3.3vh), 27px); color: #3a1d00; text-align: center;
                      opacity: 0; transform: scale(.4); transition: transform .4s cubic-bezier(.3,1.7,.5,1), opacity .2s; }
  #ruleta-resultado.visible { opacity: 1; transform: scale(1); }
  #ruleta.mini #ruleta-resultado { font-size: clamp(10px, min(3vw, 2.1vh), 16px); padding: 2px 8px; border-width: 3px; }
  .confeti { position: absolute; width: 9px; height: 14px; top: 40%; left: 50%; border-radius: 2px; opacity: 0; }
  #ruleta.festejo .confeti { animation: confeti 1.4s ease-out both; }
  @keyframes confeti { 0% { transform: translate(0,0) rotate(0); opacity: 1 }
                       100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0 } }
</style>
</head>
<body>
<div id="escena">
  <div id="zona-burbuja"><div id="burbuja"></div></div>
  <svg id="avatar" viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" aria-label="Eduardo el Calvo">
    <defs>
      <!-- ===== Piel ===== -->
      <radialGradient id="g-piel" cx="42%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#fbd7bd"/><stop offset="38%" stop-color="#efb994"/>
        <stop offset="72%" stop-color="#dc9a74"/><stop offset="100%" stop-color="#b8714f"/>
      </radialGradient>
      <radialGradient id="g-rubor" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e86a5c" stop-opacity=".45"/><stop offset="100%" stop-color="#e86a5c" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-sombra" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7a3d25" stop-opacity=".55"/><stop offset="100%" stop-color="#7a3d25" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-sombra-fria" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#1c2a3a" stop-opacity=".5"/><stop offset="100%" stop-color="#1c2a3a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-luz" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff6ee" stop-opacity=".9"/><stop offset="100%" stop-color="#fff6ee" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="g-brillo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-borde-luz" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffe9d6" stop-opacity="0"/><stop offset="100%" stop-color="#ffe9d6" stop-opacity=".75"/>
      </linearGradient>
      <linearGradient id="g-cuello" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a9603f"/><stop offset="45%" stop-color="#cf8d68"/><stop offset="100%" stop-color="#e1a47f"/>
      </linearGradient>
      <linearGradient id="g-brazo" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#c27e5a"/><stop offset="45%" stop-color="#f0bc97"/><stop offset="100%" stop-color="#b9714f"/>
      </linearGradient>
      <radialGradient id="g-oreja" cx="45%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#f3b997"/><stop offset="70%" stop-color="#da9472"/><stop offset="100%" stop-color="#bb7352"/>
      </radialGradient>
      <linearGradient id="g-nariz" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#cf8a65"/><stop offset="40%" stop-color="#f2bf9b"/><stop offset="60%" stop-color="#f2bf9b"/><stop offset="100%" stop-color="#c98260"/>
      </linearGradient>
      <!-- ===== Ojos ===== -->
      <radialGradient id="g-esclera" cx="50%" cy="55%" r="60%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f3efec"/><stop offset="100%" stop-color="#d9cdc6"/>
      </radialGradient>
      <radialGradient id="g-iris" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d9a35a"/><stop offset="35%" stop-color="#8a5a2b"/>
        <stop offset="80%" stop-color="#5a3518"/><stop offset="100%" stop-color="#2a170a"/>
      </radialGradient>
      <linearGradient id="g-sombra-parpado" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5b3524" stop-opacity=".45"/><stop offset="45%" stop-color="#5b3524" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="g-parpado" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e9ad87"/><stop offset="100%" stop-color="#d89470"/>
      </linearGradient>
      <clipPath id="clip-ojo-i"><ellipse cx="172" cy="150" rx="17" ry="19"/></clipPath>
      <clipPath id="clip-ojo-d"><ellipse cx="228" cy="150" rx="17" ry="19"/></clipPath>
      <!-- ===== Barba / bigote ===== -->
      <linearGradient id="g-barba" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#f1f3f6"/>
        <stop offset="80%" stop-color="#d7dce3"/><stop offset="100%" stop-color="#b9c0ca"/>
      </linearGradient>
      <radialGradient id="g-barba-vol" cx="50%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="60%" stop-color="#fff" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-bigote" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#eceff3"/><stop offset="100%" stop-color="#c5ccd5"/>
      </linearGradient>
      <!-- ===== Boca ===== -->
      <linearGradient id="g-labio" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b85c56"/><stop offset="55%" stop-color="#d47d72"/><stop offset="100%" stop-color="#a94f4a"/>
      </linearGradient>
      <radialGradient id="g-boca-int" cx="50%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#6e2424"/><stop offset="100%" stop-color="#2e0b0d"/>
      </radialGradient>
      <radialGradient id="g-lengua" cx="50%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#f08a86"/><stop offset="100%" stop-color="#b8484a"/>
      </radialGradient>
      <linearGradient id="g-dientes" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e3ddd4"/>
      </linearGradient>
      <clipPath id="clip-boca"><use href="#boca-hueco"/></clipPath>
      <!-- ===== Camisa ===== -->
      <linearGradient id="g-camisa" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1b5d8f"/><stop offset="22%" stop-color="#2f84bf"/><stop offset="50%" stop-color="#3a95d0"/>
        <stop offset="78%" stop-color="#2a7ab4"/><stop offset="100%" stop-color="#174f7a"/>
      </linearGradient>
      <linearGradient id="g-manga-i" x1="0" y1="0" x2="1" y2="0">

<script>
(() => {
  const p = new URLSearchParams(location.search);
  const raiz = document.getElementById("escena");
  const burbuja = document.getElementById("burbuja");
  const aviso = document.getElementById("aviso");
  const bocaAbierta = document.getElementById("boca-abierta");
  const sonrisa = document.getElementById("sonrisa");
  const hueco = document.getElementById("boca-hueco");
  const lengua = document.getElementById("lengua");
  const bigote = document.getElementById("bigote");
  const silencio = p.get("silencio") === "1";
  const demo = p.get("demo");
  let burbujaActiva = p.has("burbuja") ? p.get("burbuja") !== "0" : null; // null = lo decide el bot
  if (burbujaActiva === false) raiz.classList.add("sin-burbuja");
  if (p.get("fondo") === "verde") document.body.classList.add("fondo-verde");
  if (p.get("fondo") === "vista") document.body.classList.add("fondo-vista");
  if (p.get("fondo") === "magenta") document.body.classList.add("fondo-magenta");
  // Con el enlace público (túnel) la página vive en /e/<clave>/avatar: todo se pide con ese prefijo.
  const BASE = location.pathname.replace(/\/avatar\/?$/, "");

  // ---------------- Boca ----------------
  let apertura = 0, objetivo = 0;
  const bocaRisa = document.getElementById("boca-risa");
  const BOCA_Y = 220;  // centro de la boca en el dibujo
  function dibujarBoca(a) {
    a = Math.max(0, Math.min(1, a));
    if (raiz.classList.contains("riendo")) {
      bocaAbierta.setAttribute("opacity", "0"); sonrisa.setAttribute("opacity", "0");
      bocaRisa.setAttribute("opacity", "1");
      bocaRisa.style.transform = `scaleY(${(0.6 + a * 0.55).toFixed(2)})`;
      bigote.setAttribute("transform", `translate(0 ${(-2 - a * 3).toFixed(1)})`);
      return;
    }
    bocaRisa.setAttribute("opacity", "0");
    if (a < 0.06) { bocaAbierta.setAttribute("opacity", "0"); sonrisa.setAttribute("opacity", "1"); }
    else {
      bocaAbierta.setAttribute("opacity", "1"); sonrisa.setAttribute("opacity", "0");
      const ry = 3 + a * 14;
      hueco.setAttribute("ry", ry.toFixed(1)); hueco.setAttribute("cy", (BOCA_Y + ry * 0.45).toFixed(1));
      hueco.setAttribute("rx", (14 + a * 6).toFixed(1));
      lengua.setAttribute("cy", (BOCA_Y + ry * 1.0).toFixed(1)); lengua.setAttribute("ry", (2 + a * 3.5).toFixed(1));
      lengua.setAttribute("rx", (7 + a * 4).toFixed(1));
    }
    bigote.setAttribute("transform", `translate(0 ${(-a * 3.5).toFixed(1)})`);
  }

  // ---------------- Parpadeo ----------------
  function parpadear() {
    raiz.classList.add("parpadeo");
    setTimeout(() => raiz.classList.remove("parpadeo"), 130);
    setTimeout(parpadear, 2200 + Math.random() * 3200);
  }
  setTimeout(parpadear, 1500);

  // ---------------- Audio ----------------
  let ctx = null, analizador = null, datos = null, fuenteActual = null;
  let simular = null; // {inicio, duracion} para mover la boca sin audio
  function asegurarCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      analizador = ctx.createAnalyser(); analizador.fftSize = 1024;
      datos = new Uint8Array(analizador.fftSize);
    }
    return ctx;
  }
  function audioPermitido() { return !!ctx && ctx.state === "running"; }
  async function intentarActivar() {
    if (!asegurarCtx()) return false;
    try { await ctx.resume(); } catch (e) {}
    return audioPermitido();
  }

  function nivel() {
    if (fuenteActual && analizador && ctx.state === "running") {
      analizador.getByteTimeDomainData(datos);
      let s = 0; for (let i = 0; i < datos.length; i++) { const v = (datos[i] - 128) / 128; s += v * v; }
      const rms = Math.sqrt(s / datos.length);
      return Math.min(1, Math.max(0, (rms - 0.015) * 6));
    }
    if (simular) {
      const t = (performance.now() - simular.inicio) / 1000;
      if (t > simular.duracion) { simular = null; return 0; }
      return 0.35 + 0.35 * Math.abs(Math.sin(t * 11)) * (0.6 + 0.4 * Math.sin(t * 3.7));
    }
    return 0;
  }

  function bucle() {
    objetivo = nivel();
    apertura += (objetivo - apertura) * (objetivo > apertura ? 0.55 : 0.25);
    dibujarBoca(apertura);
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);

  // ---------------- Estados ----------------
  let temporizadores = [];
  function limpiarTemporizadores() { temporizadores.forEach(clearTimeout); temporizadores = []; }
  function mostrarBurbuja(texto, nombre) {
    if (!texto) return;
    burbuja.textContent = texto;
    burbuja.classList.toggle("largo", texto.length > 90 && texto.length <= 170);
    burbuja.classList.toggle("muy-largo", texto.length > 170);
    burbuja.classList.add("visible");
  }
  function ocultarBurbuja() { burbuja.classList.remove("visible"); }

  function empezarHabla(m, duracion) {
    limpiarTemporizadores();
    raiz.classList.add("hablando");
    raiz.classList.remove("riendo");
    if (m.gesto) hacerGesto(m.gesto, Math.max(DURACION_GESTO[m.gesto] || 3000, m.gesto === "baile" ? duracion * 1000 : 0));
    if (ruletaEl.classList.contains("visible")) ruletaEl.classList.add("mini");
    const usarBurbuja = burbujaActiva === null ? m.burbuja : burbujaActiva;
    if (usarBurbuja) mostrarBurbuja(m.texto);
    if (m.reir) {
      // En los chistes la risa llega en el remate (parte final); con "jaja" desde la mitad.
      const desde = Math.max(0.3, duracion * (m.reir_desde ?? 0.6));
      temporizadores.push(setTimeout(() => raiz.classList.add("riendo"), desde * 1000));
    }
  }
  function terminarHabla(m) {
    raiz.classList.remove("hablando");
    temporizadores.push(setTimeout(() => raiz.classList.remove("riendo"), m && m.reir ? 1400 : 0));
    temporizadores.push(setTimeout(ocultarBurbuja, 1800));
  }

  const cancelados = new Set();  // el bot decidió reproducir en la PC: aquí ya no debe sonar
  const esperar = ms => new Promise(r => setTimeout(r, ms));

  async function hablar(m) {
    let sonar = m.sonar && !silencio;
    let duracion = m.duracion || 3, buf = null;
    try {
      if (m.audio && asegurarCtx()) {
        const resp = await fetch(m.audio.startsWith("/") ? BASE + m.audio : m.audio, { cache: "no-store" });
        buf = await ctx.decodeAudioData(await resp.arrayBuffer());
        duracion = buf.duration;
      }
    } catch (e) { buf = null; }

    if (cancelados.has(m.id)) sonar = false;
    if (sonar && !audioPermitido()) await intentarActivar();
    if (sonar && (!buf || !audioPermitido())) {
      // No puedo sonar aquí: aviso al bot para que lo reproduzca en la PC, y solo muevo la boca.
      enviar({ tipo: "fin", id: m.id, ok: false, error: buf ? "audio bloqueado" : "no se pudo cargar el audio" });
    }
    const conSonidoReal = sonar && buf && audioPermitido();

    if (buf && audioPermitido()) {
      const fuente = ctx.createBufferSource(); fuente.buffer = buf;
      const ganancia = ctx.createGain(); ganancia.gain.value = conSonidoReal ? 1 : 0; // 0 = solo anima la boca
      fuente.connect(analizador); analizador.connect(ganancia); ganancia.connect(ctx.destination);
      fuenteActual = fuente;
      const fin = new Promise(r => fuente.onended = r);
      fuente.start();
      if (conSonidoReal) enviar({ tipo: "empezo", id: m.id });
      empezarHabla(m, duracion);
      await Promise.race([fin, esperar((duracion + 2) * 1000)]);
      try { analizador.disconnect(); } catch (e) {}
      fuenteActual = null;
    } else {
      simular = { inicio: performance.now(), duracion };
      empezarHabla(m, duracion);
      await esperar(duracion * 1000);
    }
    terminarHabla(m);
    if (conSonidoReal) enviar({ tipo: "fin", id: m.id, ok: true });
  }


  // ---------------- Disfraces ----------------
  const DISFRACES = ["fiesta", "sombrero", "lentes", "corona", "peluca", "bigote", "gorra", "santa"];
  function ponerDisfraz(nombre) {
    DISFRACES.forEach(d => raiz.classList.remove("disfraz-" + d));
    if (DISFRACES.includes(nombre)) raiz.classList.add("disfraz-" + nombre);
  }

  // ---------------- Gestos ----------------
  const GESTOS = ["enojo", "sorpresa", "guino", "baile", "saludo", "triste"];
  const DURACION_GESTO = { enojo: 3500, sorpresa: 3000, guino: 2500, baile: 6000, saludo: 3500, triste: 4500 };
  let finGesto = null;
  function hacerGesto(nombre, ms) {
    if (!GESTOS.includes(nombre)) return;
    GESTOS.forEach(g => raiz.classList.remove("gesto-" + g));
    void raiz.offsetWidth;  // reinicia las animaciones
    raiz.classList.add("gesto-" + nombre);
    clearTimeout(finGesto);
    finGesto = setTimeout(() => raiz.classList.remove("gesto-" + nombre), ms || DURACION_GESTO[nombre] || 3000);
  }

  // ---------------- Ruleta ----------------
  const ruletaEl = document.getElementById("ruleta");
  const rueda = document.getElementById("ruleta-rueda");
  const focos = document.getElementById("ruleta-focos");
  const nombreRuleta = document.getElementById("ruleta-nombre");
  const resultadoRuleta = document.getElementById("ruleta-resultado");
  const COLORES_RULETA = ["#e63946", "#ff9f1c", "#2ec4b6", "#7b2cbf", "#3a86ff", "#06a77d", "#f72585", "#fb5607"];
  const NS = "http://www.w3.org/2000/svg";
  let anguloRuleta = 0, temporizadoresRuleta = [];
  function nodo(tag, attrs, padre) { const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]); if (padre) padre.appendChild(n); return n; }
  function dibujarRueda(categorias) {
    rueda.innerHTML = ""; focos.innerHTML = "";
    const n = categorias.length, a = 2 * Math.PI / n, R = 100;
    categorias.forEach((cat, i) => {
      const a0 = -Math.PI / 2 + i * a, a1 = a0 + a;
      const d = `M0,0 L${(R * Math.cos(a0)).toFixed(2)},${(R * Math.sin(a0)).toFixed(2)} A${R},${R} 0 ${a > Math.PI ? 1 : 0} 1 ${(R * Math.cos(a1)).toFixed(2)},${(R * Math.sin(a1)).toFixed(2)} Z`;
      nodo("path", { d, fill: COLORES_RULETA[i % COLORES_RULETA.length], stroke: "#fff", "stroke-width": 2.5 }, rueda);
      const medio = (a0 + a1) / 2 * 180 / Math.PI;
      const t = nodo("text", { transform: `rotate(${medio.toFixed(2)}) translate(58 0) rotate(90)`, "text-anchor": "middle",
                               "font-size": n > 6 ? 9 : 11 }, rueda);
      const palabras = String(cat).split(" ");
      const lineas = palabras.length > 1 ? [palabras[0], palabras.slice(1).join(" ")] : palabras;
      lineas.forEach((l, k) => { const ts = nodo("tspan", { x: 0, dy: k === 0 ? (lineas.length > 1 ? -2 : 4) : 12 }); ts.textContent = l; t.appendChild(ts); });
    });
    nodo("circle", { r: R, fill: "none", stroke: "#ffd23f", "stroke-width": 4 }, rueda);
    for (let k = 0; k < 16; k++) { const b = k / 16 * 2 * Math.PI;
      nodo("circle", { cx: (104 * Math.cos(b)).toFixed(1), cy: (104 * Math.sin(b)).toFixed(1), r: 3, fill: k % 2 ? "#fff6c2" : "#ffd23f" }, focos); }
  }
  function confeti() {
    ruletaEl.querySelectorAll(".confeti").forEach(c => c.remove());
    for (let k = 0; k < 18; k++) {
      const c = document.createElement("div"); c.className = "confeti";
      c.style.background = COLORES_RULETA[k % COLORES_RULETA.length];
      c.style.setProperty("--x", `${Math.round((Math.random() - .5) * 320)}px`);
      c.style.setProperty("--y", `${Math.round(-60 - Math.random() * 160)}px`);
      c.style.setProperty("--r", `${Math.round(Math.random() * 720 - 360)}deg`);
      c.style.animationDelay = `${(Math.random() * .2).toFixed(2)}s`;
      ruletaEl.appendChild(c);
    }
    ruletaEl.classList.remove("festejo"); void ruletaEl.offsetWidth; ruletaEl.classList.add("festejo");
  }
  function cerrarRuleta() {
    temporizadoresRuleta.forEach(clearTimeout); temporizadoresRuleta = [];
    ruletaEl.classList.remove("visible", "mini", "festejo");
  }
  function girarRuleta(m, instantaneo) {
    cerrarRuleta();
    const categorias = m.categorias && m.categorias.length ? m.categorias : ["Reto", "Piropo calvo", "Burla amistosa", "Chiste dedicado", "Imitación de animal"];
    const i = Math.max(0, Math.min(categorias.length - 1, m.indice || 0));
    const nombres = (m.nombres && m.nombres.length ? m.nombres : [m.ganador || "?"]).slice(0, 12);
    const dur = (m.duracion || 4.6) * 1000;
    dibujarRueda(categorias);
    resultadoRuleta.classList.remove("visible");
    resultadoRuleta.textContent = `¡${m.ganador}: ${categorias[i]}!`;
    const seg = 360 / categorias.length;
    const destino = (360 - (i + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6 + 360) % 360;
    anguloRuleta = anguloRuleta - (anguloRuleta % 360) + 360 * (instantaneo ? 0 : 6) + destino;
    rueda.classList.remove("girando");
    rueda.style.transitionDuration = `${(dur / 1000).toFixed(2)}s`;
    if (instantaneo) { rueda.style.transform = `rotate(${anguloRuleta}deg)`; }
    ruletaEl.classList.add("visible");
    nombreRuleta.textContent = instantaneo ? m.ganador : nombres[0];
    const aterrizar = () => { nombreRuleta.textContent = m.ganador; resultadoRuleta.classList.add("visible"); confeti(); };
    if (instantaneo) { aterrizar(); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rueda.classList.add("girando"); rueda.style.transform = `rotate(${anguloRuleta}deg)`;
    }));
    // Los nombres pasan rápido y van frenando hasta quedar en el elegido
    let t = 0, paso = 55, k = 0;
    while (t + paso < dur - 250) {
      t += paso; paso *= 1.09; k++;
      const nombre = nombres[(k + Math.floor(Math.random() * nombres.length)) % nombres.length];
      temporizadoresRuleta.push(setTimeout(() => { nombreRuleta.textContent = nombre; }, t));
    }
    temporizadoresRuleta.push(setTimeout(aterrizar, dur));
    temporizadoresRuleta.push(setTimeout(cerrarRuleta, dur + (m.mostrar_segundos || 30) * 1000));
  }

  // ---------------- Conexión con el bot ----------------
  let ws = null;
  function enviar(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  function estadoAudio() {
    enviar({ tipo: "estado", puede_sonar: !silencio && audioPermitido(), silencio });
    aviso.style.display = (!silencio && !audioPermitido() && !demo) ? "block" : "none";
  }
  function conectar() {
    if (demo) return;
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${BASE}/ws`);
    ws.onopen = async () => { await intentarActivar(); estadoAudio(); };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.tipo === "hablar") hablar(m);
      if (m.tipo === "cancelar") cancelados.add(m.id);
      if (m.tipo === "config" && !p.has("burbuja")) raiz.classList.toggle("sin-burbuja", !m.burbuja);
      if (m.tipo === "config" && "disfraz" in m) ponerDisfraz(m.disfraz || "");
      if (m.tipo === "disfraz") ponerDisfraz(m.nombre || "");
      if (m.tipo === "gesto") hacerGesto(m.nombre, m.ms);
      if (m.tipo === "ruleta") girarRuleta(m);
      if (m.tipo === "ruleta_fin") cerrarRuleta();
    };
    ws.onclose = () => setTimeout(conectar, 2000);
  }
  aviso.addEventListener("click", async () => { await intentarActivar(); estadoAudio(); });
  document.addEventListener("click", async () => { await intentarActivar(); estadoAudio(); });
  setTimeout(() => { if (!audioPermitido()) aviso.style.display = "none"; }, 25000); // no ensuciar el LIVE

  // ---------------- Modo demostración (para capturas) ----------------
  if (demo === "hablando") { raiz.classList.add("hablando"); dibujarBoca(0.85); apertura = objetivo = 0.85;
    simular = { inicio: performance.now(), duracion: 1e9 };
    mostrarBurbuja("¡Hola, hola! Soy Eduardo el Calvo. ¿Saben por qué nunca gano a las escondidas? ¡Porque mi calva me delata desde lejos!"); }
  if (demo === "riendo") { raiz.classList.add("hablando", "riendo");
    simular = { inicio: performance.now(), duracion: 1e9 };
    mostrarBurbuja("¡Ja, ja, ja! ¡Mi calva brilla de felicidad!"); }

  // Para capturas/pruebas: ?demo=idle&disfraz=sombrero&gesto=sorpresa&ruleta=1
  if (p.get("disfraz")) { raiz.classList.add("sin-entrada"); ponerDisfraz(p.get("disfraz")); }
  if (p.get("gesto")) hacerGesto(p.get("gesto"), 1e9);
  if (p.get("ruleta")) girarRuleta({ nombres: ["Ana", "Luis", "Sofi", "Pedro", "Marta"], ganador: p.get("quien") || "Sofi",
                                     indice: parseInt(p.get("ruleta"), 10) - 1 || 0 }, p.get("girar") !== "1");
  if (p.get("ruleta_mini")) { document.body.classList.add("sin-transicion"); ruletaEl.classList.add("mini"); }
  if (demo === "hablando" && p.get("texto")) mostrarBurbuja(p.get("texto"));

  conectar();
})();
</script>
</body>
</html>
